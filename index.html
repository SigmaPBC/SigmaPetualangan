<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Angle Quiz</title>
    <style>
        :root {
            --primary: #8e44ad; /* Deep Purple */
            --accent: #fd79a8;  /* Soft Pink */
            --bg-gradient: linear-gradient(135deg, #a29bfe 0%, #fab1a0 100%);
            --white: #ffffff;
            --success: #00b894;
            --error: #d63031;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', sans-serif; }
        body { 
            background: var(--bg-gradient); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        #game-container {
            background: var(--white); width: 100%; max-width: 650px;
            border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden; border: 6px solid var(--white);
        }

        .screen { display: none; padding: 40px; animation: fadeIn 0.4s ease-out; text-align: center; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .progress-bar { width: 100%; height: 12px; background: #eee; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.5s; }

        .visual-box {
            background: #fffafa; border: 3px dashed var(--accent);
            border-radius: 20px; margin: 20px 0; padding: 15px;
            display: flex; justify-content: center; align-items: center; min-height: 230px;
        }

        input[type="number"] {
            width: 120px; padding: 12px; font-size: 28px; border: 4px solid var(--primary);
            border-radius: 15px; text-align: center; outline: none; color: var(--primary);
            background: #fdf9ff;
        }

        .btn {
            background: var(--primary); color: white; border: none; padding: 16px;
            border-radius: 15px; font-weight: bold; cursor: pointer; width: 100%; 
            font-size: 18px; transition: 0.3s; box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3);
        }
        .btn:hover { background: var(--accent); transform: translateY(-2px); }

        .review-item { text-align: left; padding: 20px; border-bottom: 2px solid #f0f0f0; margin-bottom: 12px; border-radius: 15px; }
        .rev-correct { border-left: 8px solid var(--success); background: #e6fffb; }
        .rev-wrong { border-left: 8px solid var(--error); background: #fff5f5; }
        .tick-text { font-size: 10px; fill: #555; font-weight: bold; }
        .explanation { font-size: 14px; color: #666; margin-top: 8px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 8px; }
        
        #instruction-text { font-weight: 600; color: #d63031; background: #fff5f5; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: none; }
        h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="progress-bar"><div id="progress-fill"></div></div>

    <div id="screen-start" class="screen active">
        <h1>📐 Interactive Angle Quiz</h1>
        <p style="color: #636e72; font-size: 1.1rem; margin-bottom: 30px;">Practice geometry with these colorful exercises!</p>
        <button class="btn" onclick="start()">START THE QUIZ</button>
    </div>

    <div id="screen-quiz" class="screen">
        <div style="display: flex; justify-content: space-between; font-weight: bold; color: var(--primary); margin-bottom: 10px;">
            <span id="lvl-info">Question 1/10</span>
            <span id="score-live">Score: 0</span>
        </div>
        <p id="q-text" style="margin: 10px 0; font-size: 19px; color: #2d3436; font-weight: 600;"></p>
        <div id="instruction-text">Note: Black Hand (Short) is Hour | Red Hand (Long) is Minute.</div>
        <div class="visual-box" id="visual"></div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
            <input type="number" id="ans-input" placeholder="0"> <b style="font-size: 30px; color: var(--primary);">°</b>
        </div>
        <button class="btn" style="margin-top:25px" onclick="check()">SUBMIT ANSWER</button>
    </div>

    <div id="screen-result" class="screen">
        <h2 style="color: var(--primary); font-size: 2rem;">Quiz Finished!</h2>
        <div id="final-score" style="font-size: 1.5rem; margin: 10px 0; font-weight: bold;">Score: 0 / 10</div>
        <div id="review-area" style="max-height: 400px; overflow-y: auto; margin: 20px 0; border: 2px solid #eee; padding: 15px; border-radius: 20px; background: #fafafa;"></div>
        <button class="btn" onclick="location.reload()">TRY AGAIN</button>
    </div>
</div>

<script>
    let current = 0;
    let score = 0;
    let userHistory = [];

    function createClockSVG(hour, minute) {
        let marks = "";
        for(let i=1; i<=12; i++) {
            let ang = (i * 30) * Math.PI / 180;
            let x = 50 + 38 * Math.sin(ang);
            let y = 50 - 38 * Math.cos(ang);
            marks += `<text x="${x}" y="${y+3}" class="tick-text" text-anchor="middle">${i}</text>`;
        }
        const hAng = (hour * 30) + (minute * 0.5);
        const mAng = minute * 6;
        return `<svg width="220" height="220" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="48" fill="white" stroke="#8e44ad" stroke-width="2.5"/>
            ${marks}
            <line x1="50" y1="50" x2="${50 + 24 * Math.sin(hAng * Math.PI/180)}" y2="${50 - 24 * Math.cos(hAng * Math.PI/180)}" stroke="#2d3436" stroke-width="5" stroke-linecap="round"/>
            <line x1="50" y1="50" x2="${50 + 38 * Math.sin(mAng * Math.PI/180)}" y2="${50 - 38 * Math.cos(mAng * Math.PI/180)}" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="3.5" fill="#2d3436"/>
        </svg>`;
    }

    const quiz = [
        { q: "Pukul 02.00. Berapa besar sudutnya?", svg: createClockSVG(2, 0), a: 60, exp: "Every hour on a clock is 30°. 2 hours x 30° = 60°." },
        { q: "It's 04:00. What is the measure of the smaller angle?", svg: createClockSVG(4, 0), a: 120, exp: "4 hours x 30° = 120°." },
        { q: "Supplementary angles: If the known side is 130°, find x.", svg: `<svg width="200" height="100"><line x1="10" y1="80" x2="190" y2="80" stroke="black" stroke-width="3"/><line x1="100" y1="80" x2="40" y2="25" stroke="#fd79a8" stroke-width="4"/><text x="40" y="75" fill="red" font-weight="bold">x</text><text x="120" y="75">130°</text></svg>`, a: 50, exp: "Straight lines are 180°. 180 - 130 = 50°." },
        { q: "Opposite angles: If the top angle is 110°, find the bottom angle.", svg: `<svg width="180" height="120"><line x1="20" y1="20" x2="160" y2="100" stroke="black"/><line x1="20" y1="100" x2="160" y2="20" stroke="black"/><text x="80" y="40">110°</text><text x="85" y="90" fill="red" font-weight="bold">?</text></svg>`, a: 110, exp: "Vertically opposite angles are equal." },
        { q: "It's 06:00. What is the degree of the angle?", svg: createClockSVG(6, 0), a: 180, exp: "The hands form a flat straight line, which is 180°." },
        { q: "It's 09:00. What is the smaller angle measure?", svg: createClockSVG(9, 0), a: 90, exp: "3 hours difference x 30° = 90°." },
        { q: "Complementary angles: If one part is 35°, find y.", svg: `<svg width="150" height="120"><path d="M 30 110 L 130 110 M 30 110 L 30 20" fill="none" stroke="black" stroke-width="3"/><line x1="30" y1="110" x2="110" y2="70" stroke="#fd79a8"/><text x="60" y="100">35°</text><text x="40" y="60" fill="red" font-weight="bold">y</text></svg>`, a: 55, exp: "Right angles are 90°. 90 - 35 = 55°." },
        { q: "It's 03:30. What is the measure of the smaller angle?", svg: createClockSVG(3, 30), a: 75, exp: "Hour hand at 3.5 (15°) + distance to 6 (60°) = 75°." },
        { q: "Parallel lines: If the alternate interior angle is 110°, find its pair.", svg: `<svg width="200" height="100"><line x1="10" y1="30" x2="190" y2="30" stroke="#8e44ad" stroke-width="2"/><line x1="10" y1="70" x2="190" y2="70" stroke="#8e44ad" stroke-width="2"/><line x1="50" y1="10" x2="150" y2="90" stroke="black"/><text x="65" y="85">110°</text><text x="105" y="25" fill="red" font-weight="bold">?</text></svg>`, a: 110, exp: "Alternate interior angles are equal (both obtuse in this case)." },
        { q: "Reflex angle is 320°. Find the value of x.", svg: `<svg width="120" height="120" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#ddd"/><path d="M 50 50 L 90 50 A 40 40 0 1 1 50 10 Z" fill="#fd79a8" opacity="0.2"/><line x1="50" y1="50" x2="90" y2="50" stroke="black"/><line x1="50" y1="50" x2="50" y2="10" stroke="black"/><text x="25" y="70">320°</text><text x="55" y="45" fill="red" font-weight="bold">x</text></svg>`, a: 40, exp: "360 - 320 = 40°." }
    ];

    function start() {
        document.getElementById('screen-start').classList.remove('active');
        document.getElementById('screen-quiz').classList.add('active');
        loadQ();
    }

    function loadQ() {
        const d = quiz[current];
        document.getElementById('lvl-info').innerText = `Question ${current + 1}/10`;
        document.getElementById('q-text').innerText = d.q;
        document.getElementById('visual').innerHTML = d.svg;
        document.getElementById('ans-input').value = "";
        document.getElementById('progress-fill').style.width = (current / 10 * 100) + "%";
        document.getElementById('instruction-text').style.display = (current === 0) ? "block" : "none";
        document.getElementById('ans-input').focus();
    }

    function check() {
        const val = document.getElementById('ans-input').value;
        if(val === "") return;
        const isCorrect = val == quiz[current].a;
        if(isCorrect) score++;
        userHistory.push({ q: quiz[current].q, userAns: val, correctAns: quiz[current].a, isCorrect: isCorrect, exp: quiz[current].exp });
        document.getElementById('score-live').innerText = `Score: ${score}`;
        current++;
        if(current < 10) loadQ();
        else showResult();
    }

    function showResult() {
        document.getElementById('screen-quiz').classList.remove('active');
        document.getElementById('screen-result').classList.add('active');
        document.getElementById('progress-fill').style.width = "100%";
        document.getElementById('final-score').innerText = `You got ${score} out of 10!`;
        let html = "<h3>Review Your Answers:</h3>";
        userHistory.forEach((h, i) => {
            html += `<div class="review-item ${h.isCorrect ? 'rev-correct' : 'rev-wrong'}">
                <strong>No ${i+1}:</strong> ${h.q}<br>
                <span>Your Answer: ${h.userAns}° | <strong>Correct: ${h.correctAns}°</strong></span>
                <div class="explanation">💡 ${h.exp}</div>
            </div>`;
        });
        document.getElementById('review-area').innerHTML = html;
    }
</script>
</body>
</html>
