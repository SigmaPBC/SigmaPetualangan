<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Adventure: Average Master</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --success: #00b894;
            --danger: #d63031;
            --bg: #f0f3f7;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', 'Comic Sans MS', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .quiz-card {
            background: white;
            width: 95%;
            max-width: 650px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }

        .progress-container {
            width: 100%;
            height: 12px;
            background: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 30px;
            display: none;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border-radius: 10px;
            transition: 0.4s ease;
        }

        h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 10px; }
        .question-text { font-size: 1.3rem; color: #2d3436; margin-bottom: 25px; line-height: 1.6; text-align: left; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--light);
            border: 2px solid #dfe6e9;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            font-weight: 600;
            color: #4b4b4b;
        }

        .option-btn:hover {
            border-color: var(--secondary);
            background: #f0f0ff;
        }

        .option-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        #quiz-screen, #result-screen { display: none; }
        .score-box { font-size: 4rem; color: var(--primary); font-weight: 800; margin: 20px 0; }
    </style>
</head>
<body>

<div class="quiz-card">
    <!-- WELCOME -->
    <div id="welcome-screen">
        <div style="font-size: 70px;">🍫</div>
        <h1>Average Challenge</h1>
        <p style="color: #636e72; font-size: 1.1rem; margin-bottom: 30px;">
            Let's share things equally!<br>How many will be in each row?
        </p>
        <button class="btn-main" onclick="startQuiz()">START QUIZ 🚀</button>
    </div>

    <!-- QUIZ -->
    <div id="quiz-screen">
        <div class="progress-container" id="p-container">
            <div id="progress-bar"></div>
        </div>
        <div id="question-content">
            <p id="q-number" style="color: var(--primary); font-weight: bold; text-align: left;"></p>
            <div id="q-text" class="question-text"></div>
            <div id="options" class="options-grid"></div>
        </div>
        <button id="next-btn" class="btn-main" style="width: 100%; margin-top: 20px;" onclick="handleNext()" disabled>Check & Next ➔</button>
    </div>

    <!-- RESULT -->
    <div id="result-screen">
        <div style="font-size: 60px;" id="res-emoji">🎉</div>
        <h1 id="res-title">Finished!</h1>
        <div class="score-box"><span id="final-score">0</span>/13</div>
        <p id="res-msg" style="font-size: 1.1rem; color: #636e72; margin-bottom: 30px;"></p>
        <button class="btn-main" onclick="location.reload()">Try Again 🔄</button>
    </div>
</div>

<script>
    const questions = [
        { 
            q: "There are 12 chocolate bars in total. If you share them equally into 4 rows, <b>how many bars will be in each row?</b>", 
            options: ["2", "3", "4", "6"], 
            a: "3" 
        },
        { q: "Daily Steps (hundreds): 10, 20, 30, 40, 50, 60. Find the average.", options: ["30", "35", "40", "45"], a: "35" },
        { q: "Baskets of Mangoes: 12, 14, 16, 18, 20. What is the average?", options: ["14", "15", "16", "17"], a: "16" },
        { q: "Points in a Game: 15, 25, 35, 45, 55. Find the average points.", options: ["25", "30", "35", "40"], a: "35" },
        { q: "Pages Read: 10, 15, 20, 25, 30, 35, 40. Find the average.", options: ["20", "25", "30", "35"], a: "25" },
        { q: "Fishing Trip: 4, 8, 12, 16, 20, 24, 28. Find the average catch.", options: ["12", "14", "16", "18"], a: "16" },
        { q: "Saving Money: $2, $4, $6, $8, $10, $12, $14, $16. Average?", options: ["$8", "$9", "$10", "$11"], a: "$9" },
        { q: "Avg height of 3 plants is 15 cm. What is the TOTAL height?", options: ["30 cm", "40 cm", "45 cm", "50 cm"], a: "45 cm" },
        { q: "Avg mass of 5 bags is 8 kg. Find the TOTAL mass.", options: ["35 kg", "40 kg", "45 kg", "50 kg"], a: "40 kg" },
        { q: "Avg score of 2 tests is 80. First score is 75, what is the second?", options: ["80", "85", "90", "95"], a: "85" },
        { q: "Rainfall Mon-Fri avg: 10mm. Sat: 22mm. New avg for 6 days?", options: ["11 mm", "12 mm", "13 mm", "14 mm"], a: "12 mm" },
        { q: "4 players avg 12 pts. A 5th player scores 17. New team avg?", options: ["12", "13", "14", "15"], a: "13" },
        { q: "3 pens avg $1.50. Add a 4th pen, avg becomes $1.60. Price of 4th?", options: ["$1.70", "$1.80", "$1.90", "$2.00"], a: "$1.90" }
    ];

    let currentIdx = 0;
    let score = 0;
    let selectedAnswer = null;

    function startQuiz() {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('p-container').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentIdx];
        selectedAnswer = null;
        document.getElementById('next-btn').disabled = true;
        
        document.getElementById('q-number').innerText = `Challenge ${currentIdx + 1} of 13`;
        document.getElementById('q-text').innerHTML = q.q;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, opt);
            optionsDiv.appendChild(btn);
        });

        const progress = (currentIdx / questions.length) * 100;
        document.getElementById('progress-bar').style.width = progress + "%";
    }

    function selectOption(btn, val) {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedAnswer = val;
        document.getElementById('next-btn').disabled = false;
    }

    function handleNext() {
        if (selectedAnswer === questions[currentIdx].a) {
            score++;
        }

        currentIdx++;
        if (currentIdx < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score;
        
        const msg = document.getElementById('res-msg');
        if(score === 13) { msg.innerText = "Unbelievable! You are a Math Wizard!"; }
        else if(score > 9) { msg.innerText = "Great job! You really know your Averages!"; }
        else { msg.innerText = "Good effort! Practice more to become a Master!"; }
    }
</script>

</body>
</html>
