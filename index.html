<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Adventure: Average Master</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --success: #00b894;
            --danger: #d63031;
            --bg: #f0f3f7;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .quiz-card {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Welcome Screen */
        #welcome-screen img { width: 150px; margin-bottom: 20px; }
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 10px; }
        p.intro-text { color: #636e72; font-size: 1.1rem; margin-bottom: 30px; }

        /* Quiz Screen */
        #quiz-screen { display: none; text-align: left; }
        .progress-container {
            width: 100%;
            height: 10px;
            background: #dfe6e9;
            border-radius: 5px;
            margin-bottom: 30px;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 5px;
            transition: 0.3s;
        }

        .question-box h2 { color: #2d3436; font-size: 1.3rem; margin-bottom: 20px; line-height: 1.5; }
        .input-wrapper { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        
        input {
            padding: 12px;
            font-size: 1.2rem;
            border: 3px solid #dfe6e9;
            border-radius: 10px;
            width: 120px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--secondary); }

        /* Buttons */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-weight: bold;
        }
        .btn:hover { background: var(--secondary); transform: scale(1.05); }
        .btn-next { float: right; }

        /* Results */
        #result-screen { display: none; }
        .score-circle {
            width: 150px;
            height: 150px;
            line-height: 150px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-size: 3rem;
            margin: 20px auto;
            font-weight: bold;
        }

        .feedback-icon { font-size: 4rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="quiz-card">
    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen">
        <div style="font-size: 80px;">📊</div>
        <h1>Math Adventure</h1>
        <p class="intro-text">Ready to become an <b>Average Master</b>?<br>Solve 13 fun challenges to win the trophy!</p>
        <button class="btn" onclick="startQuiz()">START ADVENTURE 🚀</button>
    </div>

    <!-- 2. QUIZ SCREEN -->
    <div id="quiz-screen">
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="question-container" class="question-box">
            <!-- Questions will be injected here by JS -->
        </div>
        <div style="margin-top: 30px; overflow: hidden;">
            <button id="next-btn" class="btn btn-next" onclick="nextQuestion()">Next Question ➔</button>
        </div>
    </div>

    <!-- 3. RESULT SCREEN -->
    <div id="result-screen">
        <div id="feedback-emoji" class="feedback-icon">🏆</div>
        <h2 id="result-title">Amazing Job!</h2>
        <div class="score-circle" id="final-score">0</div>
        <p id="result-text">You are officially a Math Superstar!</p>
        <button class="btn" onclick="location.reload()">Play Again 🔄</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Chocolate Bars: 3, 5, 7, 9, and 11.<br>What is the average?", a: "7" },
        { q: "Daily Steps (in hundreds): 10, 20, 30, 40, 50, and 60.<br>Find the average steps.", a: "35" },
        { q: "Baskets of Mangoes: 12, 14, 16, 18, and 20.<br>What is the average?", a: "16" },
        { q: "Points in a Game: 15, 25, 35, 45, and 55.<br>Find the average points.", a: "35" },
        { q: "Pages Read: 10, 15, 20, 25, 30, 35, and 40.<br>What is the average?", a: "25" },
        { q: "Fishing Trip: 4, 8, 12, 16, 20, 24, and 28.<br>Find the average catch.", a: "16" },
        { q: "Saving Money: $2, $4, $6, $8, $10, $12, $14, and $16.<br>What is the average saved?", a: "9" },
        { q: "The average height of 3 plants is 15 cm.<br>What is the <b>TOTAL</b> height of the 3 plants?", a: "45" },
        { q: "The average mass of 5 bags is 8 kg.<br>Find the <b>TOTAL</b> mass of the bags.", a: "40" },
        { q: "The average score of 2 tests is 80. If the first score is 75, what is the second score?", a: "85" },
        { q: "Rainfall Mon-Fri: 10mm. Saturday: 22mm.<br>What is the new average for 6 days?", a: "12" },
        { q: "4 players avg 12 pts. A 5th player scores 17 pts.<br>What is the new team average?", a: "13" },
        { q: "3 pens avg $1.50. Add a 4th pen, avg becomes $1.60.<br>What is the price of the 4th pen?", a: "1.90" }
    ];

    let currentIdx = 0;
    let score = 0;

    function startQuiz() {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentIdx];
        const container = document.getElementById('question-container');
        const progress = ((currentIdx) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = progress + "%";

        container.innerHTML = `
            <p style="color: var(--primary); font-weight: bold;">Question ${currentIdx + 1} of ${questions.length}</p>
            <h2>${q.q}</h2>
            <div class="input-wrapper">
                <input type="text" id="user-answer" placeholder="Result..." autocomplete="off">
            </div>
        `;
        document.getElementById('user-answer').focus();
    }

    function nextQuestion() {
        const userVal = document.getElementById('user-answer').value.trim();
        
        if (userVal === "") {
            alert("Please enter an answer first!");
            return;
        }

        if (userVal === questions[currentIdx].a) {
            score++;
        }

        currentIdx++;

        if (currentIdx < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score;

        const title = document.getElementById('result-title');
        const text = document.getElementById('result-text');
        const emoji = document.getElementById('feedback-emoji');

        if (score === questions.length) {
            title.innerText = "Perfect Score!";
            emoji.innerText = "🏆";
            text.innerText = "You are a true Average Master!";
        } else if (score >= 7) {
            title.innerText = "Great Job!";
            emoji.innerText = "🌟";
            text.innerText = "You have a solid understanding of averages!";
        } else {
            title.innerText = "Keep Practicing!";
            emoji.innerText = "💪";
            text.innerText = "Review the material and try again to get a higher score!";
        }
    }
</script>

</body>
</html>
