<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live HTML Previewer | Premium Dev Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --accent-color: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Styling */
    header {
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: white;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }

    .btn-secondary {
      background: var(--panel-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Main Content */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .panel-header {
      padding: 12px 20px;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.5);
      letter-spacing: 1px;
    }

    /* Editor Panel */
    .editor-container {
      flex: 1;
      position: relative;
    }

    #htmlInput {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: #e2e8f0;
      padding: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      outline: none;
      white-space: pre;
    }

    /* Preview Panel */
    .preview-panel {
      background: white;
      border-left: 1px solid var(--border);
    }

    #previewFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    /* Mobile Adaptivity */
    @media (max-width: 768px) {
      main {
        flex-direction: column;
      }
      .panel {
        flex: none;
        height: 50%;
      }
      .preview-panel {
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div style="width: 32px; height: 32px; background: var(--accent-gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
      </div>
      <h1>LIVE VIEW</h1>
    </div>
    
    <div class="controls">
      <div class="toggle-group">
        <input type="checkbox" id="autoSync" checked>
        <label for="autoSync">Auto Sync</label>
      </div>
      <button class="btn btn-secondary" onclick="clearEditor()">Clear</button>
      <button class="btn btn-secondary" onclick="toggleFullScreen()" title="Toggle Full Screen (Preview)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        Full Screen
      </button>
      <button class="btn btn-primary" onclick="updatePreview()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Render View
      </button>
    </div>
  </header>

  <main>
    <!-- EDITOR PANEL -->
    <div class="panel">
      <div class="panel-header">HTML / CSS / JS Editor</div>
      <div class="editor-container">
        <textarea id="htmlInput" placeholder="<!-- Paste your HTML here... -->" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- PREVIEW PANEL -->
    <div class="panel preview-panel">
      <div class="panel-header" style="color: #64748b;">Live Preview</div>
      <iframe id="previewFrame"></iframe>
    </div>
  </main>

  <script>
    const htmlInput = document.getElementById('htmlInput');
    const previewFrame = document.getElementById('previewFrame');
    const autoSync = document.getElementById('autoSync');

    // Function to update the preview
    function updatePreview() {
      const code = htmlInput.value;
      const preview = previewFrame.contentDocument || previewFrame.contentWindow.document;
      
      preview.open();
      preview.write(code || '<html><body></body></html>');
      preview.close();
    }

    // Auto-sync listener
    htmlInput.addEventListener('input', () => {
      if (autoSync.checked) {
        updatePreview();
      }
    });

    // Handle "Paste" specifically for immediate response
    htmlInput.addEventListener('paste', () => {
      setTimeout(updatePreview, 10);
    });

    // Clear Editor
    function clearEditor() {
      if (confirm('Are you sure you want to clear the editor?')) {
        htmlInput.value = '';
        updatePreview();
      }
    }

    // Toggle Full Screen for the preview frame
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        previewFrame.requestFullscreen().catch(err => {
          alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    // Initial Placeholder
    window.onload = () => {
      const initialCode = `<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      font-family: sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      padding: 60px;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      font-size: 1.1rem;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Success</div>
    <h1>View Ready! 🚀</h1>
    <p>Paste your HTML on the left. The view will update instantly with Auto Sync enabled.</p>
  </div>
</body>
</html>`;
      htmlInput.value = initialCode;
      updatePreview();
    };
  </script>
</body>
</html>
