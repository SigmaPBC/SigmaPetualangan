<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Mission - Final Verified Edition</title>
    <style>
        :root {
            --dark-blue: #0a192f;
            --red: #ff4d4d;
            --green: #4caf50;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark-blue);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--white);
        }

        #quiz-container {
            width: 95%;
            max-width: 650px;
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            color: #1a1a1a;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        }

        .screen { display: none; padding: 30px; text-align: center; }
        .screen.active { display: block; }

        #opening-screen {
            background: linear-gradient(135deg, #0a192f 0%, var(--red) 100%);
            color: white;
        }

        .btn-main {
            background: var(--red);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        .diagram-box {
            background: #fdfdfd;
            border: 2px solid #eee;
            border-radius: 15px;
            margin: 20px 0;
            padding: 25px;
        }

        svg { max-width: 100%; height: auto; display: block; margin: auto; }
        .shape { fill: #e3f2fd; stroke: #0d47a1; stroke-width: 3; }
        .line { stroke: #333; stroke-width: 2.5; }
        .point-label { font-size: 22px; font-weight: 900; fill: #000; font-family: Arial; }
        .angle-label { font-size: 16px; fill: #d32f2f; font-weight: bold; }

        .options { display: grid; gap: 10px; margin-top: 15px; }
        .opt-btn {
            background: #f0f2f5;
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            transition: 0.2s;
        }

        .opt-btn.correct { background-color: var(--green) !important; color: white; border-color: #2e7d32; }
        .opt-btn.wrong { background-color: var(--red) !important; color: white; border-color: #b71c1c; }
        .disabled { pointer-events: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="opening-screen" class="screen active">
        <h1>GEOMETRY MISSION</h1>
        <p>10 Verified Levels • Accurate Visuals & Labels</p>
        <button class="btn-main" onclick="startQuiz()">START MISSION</button>
    </div>

    <div id="question-screen" class="screen">
        <div id="progress" style="font-weight: bold; color: var(--red); margin-bottom: 5px;"></div>
        <h3 id="q-text" style="margin: 10px 0;"></h3>
        <div class="diagram-box" id="diagram-container"></div>
        <div id="options-container" class="options"></div>
        <button id="next-btn" class="btn-main" style="display:none;" onclick="goNext()">NEXT LEVEL</button>
    </div>

    <div id="review-screen" class="screen">
        <h2>Mission Summary</h2>
        <div id="final-score" style="font-size: 2.5em; margin: 15px 0;"></div>
        <div style="max-height: 250px; overflow-y: auto;">
            <table>
                <thead><tr><th>No</th><th>Result</th><th>Key</th></tr></thead>
                <tbody id="review-body"></tbody>
            </table>
        </div>
        <button class="btn-main" onclick="location.reload()">RESTART</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "ABCD is a parallelogram. If ∠ABC = 135°, find the size of ∠BCD.",
            options: ["45°", "135°", "180°", "60°"], correct: 0,
            diagram: `<svg viewBox="0 0 240 120">
                <polygon points="20,20 150,20 220,100 90,100" class="shape"/>
                <text x="5" y="25" class="point-label">A</text><text x="155" y="25" class="point-label">B</text>
                <text x="225" y="115" class="point-label">C</text><text x="75" y="115" class="point-label">D</text>
                <text x="120" y="45" class="angle-label">135°</text></svg>`
        },
        {
            q: "In an isosceles triangle ABC (AB = AC), if ∠A = 40°, find the base angle ∠B.",
            options: ["40°", "70°", "140°", "80°"], correct: 1,
            diagram: `<svg viewBox="0 0 200 160">
                <polygon points="100,20 50,130 150,130" class="shape"/>
                <text x="92" y="15" class="point-label">A</text><text x="30" y="145" class="point-label">B</text><text x="155" y="145" class="point-label">C</text>
                <text x="88" y="60" class="angle-label">40°</text></svg>`
        },
        {
            q: "WXYZ is a trapezium (WX // ZY). If ∠W = 120°, find the size of ∠Z.",
            options: ["120°", "60°", "180°", "90°"], correct: 1,
            diagram: `<svg viewBox="0 0 240 130">
                <polygon points="60,20 190,20 220,100 20,100" class="shape"/>
                <text x="45" y="25" class="point-label">W</text><text x="195" y="25" class="point-label">X</text>
                <text x="225" y="115" class="point-label">Y</text><text x="5" y="115" class="point-label">Z</text>
                <text x="65" y="55" class="angle-label">120°</text></svg>`
        },
        {
            q: "In Rhombus PQRS, ∠PQR = 110°. Find ∠QPR (PR is a diagonal).",
            options: ["110°", "70°", "35°", "55°"], correct: 2,
            diagram: `<svg viewBox="0 0 200 140">
                <polygon points="100,10 180,70 100,130 20,70" class="shape"/>
                <line x1="100" y1="10" x2="100" y2="130" class="line" style="stroke-dasharray:5"/>
                <text x="92" y="5" class="point-label">P</text><text x="185" y="75" class="point-label">Q</text>
                <text x="105" y="150" class="point-label">R</text><text x="5" y="75" class="point-label">S</text>
                <text x="145" y="75" class="angle-label">110°</text></svg>`
        },
        {
            q: "In rectangle ABCD, diagonal AC creates ∠BAC = 30°. Find ∠DAC.",
            options: ["30°", "60°", "90°", "45°"], correct: 1,
            diagram: `<svg viewBox="0 0 240 120">
                <rect x="30" y="20" width="180" height="80" class="shape"/>
                <line x1="30" y1="100" x2="210" y2="20" class="line"/>
                <text x="10" y="115" class="point-label">A</text><text x="215" y="115" class="point-label">B</text>
                <text x="215" y="25" class="point-label">C</text><text x="10" y="25" class="point-label">D</text>
                <text x="60" y="90" class="angle-label">30°</text></svg>`
        },
        {
            q: "A right-angled triangle ABC has ∠B = 90° and ∠A = 35°. Find ∠C.",
            options: ["55°", "35°", "90°", "145°"], correct: 0,
            diagram: `<svg viewBox="0 0 160 130">
                <polygon points="40,20 40,110 150,110" class="shape"/>
                <text x="32" y="15" class="point-label">A</text><text x="20" y="125" class="point-label">B</text><text x="155" y="125" class="point-label">C</text>
                <text x="45" y="45" class="angle-label">35°</text></svg>`
        },
        {
            q: "Kite ABCD has ∠A = 100° and ∠C = 40°. Find ∠B (where ∠B = ∠D).",
            options: ["110°", "140°", "70°", "100°"], correct: 0,
            diagram: `<svg viewBox="0 0 200 160">
                <polygon points="100,10 160,60 100,150 40,60" class="shape"/>
                <text x="92" y="10" class="point-label">A</text><text x="165" y="65" class="point-label">B</text>
                <text x="92" y="170" class="point-label">C</text><text x="15" y="65" class="point-label">D</text>
                <text x="90" y="45" class="angle-label">100°</text><text x="90" y="130" class="angle-label">40°</text></svg>`
        },
        {
            q: "In square ABCD, diagonals AC and BD intersect at point O. Find ∠AOB.",
            options: ["45°", "60°", "90°", "180°"], correct: 2,
            diagram: `<svg viewBox="0 0 140 140">
                <rect x="20" y="20" width="100" height="100" class="shape"/>
                <line x1="20" y1="20" x2="120" y2="120" class="line"/><line x1="120" y1="20" x2="20" y2="100" class="line"/>
                <text x="10" y="20" class="point-label">A</text><text x="125" y="20" class="point-label">B</text>
                <text x="65" y="75" class="point-label">O</text></svg>`
        },
        {
            q: "Triangle ABC is equilateral. Find the size of interior angle ∠BAC.",
            options: ["60°", "90°", "180°", "45°"], correct: 0,
            diagram: `<svg viewBox="0 0 140 120">
                <polygon points="70,20 20,110 120,110" class="shape"/>
                <text x="65" y="15" class="point-label">A</text><text x="5" y="125" class="point-label">B</text><text x="125" y="125" class="point-label">C</text></svg>`
        },
        {
            q: "Straight line ABC is intersected by line BD. If ∠ABD = 150°, find ∠DBC.",
            options: ["30°", "150°", "180°", "60°"], correct: 0,
            diagram: `<svg viewBox="0 0 220 110">
                <line x1="10" y1="90" x2="210" y2="90" class="line"/>
                <line x1="110" y1="90" x2="160" y2="30" class="line"/>
                <text x="10" y="105" class="point-label">A</text><text x="105" y="105" class="point-label">B</text>
                <text x="210" y="105" class="point-label">C</text><text x="165" y="30" class="point-label">D</text>
                <text x="75" y="80" class="angle-label">150°</text></svg>`
        }
    ];

    let currentQ = 0;
    let score = 0;
    let history = [];

    function startQuiz() {
        document.getElementById('opening-screen').classList.remove('active');
        document.getElementById('question-screen').classList.add('active');
        renderQuestion();
    }

    function renderQuestion() {
        const item = quizData[currentQ];
        document.getElementById('progress').innerText = `LEVEL ${currentQ + 1} / 10`;
        document.getElementById('q-text').innerText = item.q;
        document.getElementById('diagram-container').innerHTML = item.diagram;
        document.getElementById('next-btn').style.display = 'none';
        
        const optDiv = document.getElementById('options-container');
        optDiv.innerHTML = '';
        item.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, index);
            optDiv.appendChild(btn);
        });
    }

    function checkAnswer(btn, selected) {
        const correct = quizData[currentQ].correct;
        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.classList.add('disabled'));

        if (selected === correct) {
            btn.classList.add('correct');
            score++;
            history.push({ status: 'PASS', key: quizData[currentQ].options[correct] });
        } else {
            btn.classList.add('wrong');
            allBtns[correct].classList.add('correct');
            history.push({ status: 'FAIL', key: quizData[currentQ].options[correct] });
        }
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function goNext() {
        if (currentQ < 9) {
            currentQ++;
            renderQuestion();
        } else {
            showReview();
        }
    }

    function showReview() {
        document.getElementById('question-screen').classList.remove('active');
        document.getElementById('review-screen').classList.add('active');
        document.getElementById('final-score').innerText = `${score} / 10`;
        const body = document.getElementById('review-body');
        body.innerHTML = '';
        history.forEach((h, i) => {
            body.innerHTML += `<tr><td>${i+1}</td><td style="color:${h.status==='PASS'?'green':'red'}">${h.status}</td><td>${h.key}</td></tr>`;
        });
    }
</script>
</body>
</html>
