<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singapore Math Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:linear-gradient(135deg,#6ec6ff,#b388ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    width:95%;
    max-width:600px;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    text-align:center;
}
h1{margin-bottom:5px;}

button{
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    font-size:16px;
    cursor:pointer;
}
button:hover{background:#0d47a1;}

.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    margin:8px 0;
    text-align:left;
    cursor:pointer;
}
.option:hover{background:#f1f7ff;}

.hidden{display:none;}

#timerText{
    font-weight:bold;
    color:#d32f2f;
    margin:10px 0;
}

#timerBar{
    height:12px;
    background:#43a047;
    border-radius:10px;
    transition:width 1s linear;
}
</style>
</head>

<body>

<div class="container">

<div id="startPage">
<h1>📘 Singapore Math Challenge</h1>
<p>Jawab setiap soal dalam 5 menit.</p>
<button onclick="startQuiz()">Mulai Quiz</button>
</div>

<div id="quizPage" class="hidden">
<div id="timerText"></div>
<div id="timerBar"></div>
<h3 id="question"></h3>
<div id="options"></div>
</div>

<div id="resultPage" class="hidden">
<h2>🎉 Quiz Selesai</h2>
<p id="result"></p>
<button onclick="location.reload()">Ulangi</button>
</div>

</div>

<script>
// ==== SOUND EFFECT ====
function playSound(correct=true){
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();
osc.frequency.value=correct?600:200;
osc.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime+0.25);
}

// ==== DATA SOAL (SESUAI LEMBAR YANG DIKIRIM) ====
const quiz=[

// 1
{
q:"Biaya memasang ubin untuk 16 m² adalah $368. Jika seseorang membayar $644, berapa luas lantai yang dipasang ubin?",
options:["24 m²","26 m²","28 m²","32 m²"],
answer:2
},

// 2
{
q:"Buah ceri dijual $0,85 per 100 g. Jika seseorang membayar $21,25, berapa kilogram ceri yang dibeli?",
options:["2 kg","2,5 kg","3 kg","4 kg"],
answer:1
},

// 3
{
q:"Diketahui 50 dolar setara dengan 150 ringgit. Berapa ringgit untuk 1 dolar?",
options:["2","3","4","5"],
answer:1
},

// 4
{
q:"Jika 1 dolar = 3 ringgit, berapa ringgit yang didapat dari 20 dolar?",
options:["40","50","60","80"],
answer:2
},

// 5
{
q:"Jika 1 dolar = 3 ringgit, berapa dolar yang diperlukan untuk 90 ringgit?",
options:["20","25","30","35"],
answer:2
},

// 6
{
q:"Harga paket wisata Deluxe: Dewasa $650, Anak $260. Sebuah keluarga terdiri dari 2 dewasa dan 2 anak. Berapa total biaya?",
options:["$1.560","$1.820","$2.040","$2.200"],
answer:1
},

// 7
{
q:"Tangki air bertambah dari 20 L menjadi 100 L dalam 20 menit. Berapa laju aliran air per menit?",
options:["3 L","4 L","5 L","6 L"],
answer:1
},

// 8
{
q:"Dengan laju yang sama, berapa menit diperlukan untuk menambah 40 L air?",
options:["8 menit","9 menit","10 menit","12 menit"],
answer:2
},

// 9
{
q:"Harga 5 buku adalah $45. Berapa harga 8 buku dengan harga yang sama?",
options:["$64","$68","$72","$75"],
answer:2
},

// 10
{
q:"Sebuah mobil menempuh 120 km dalam 2 jam dengan kecepatan tetap. Berapa jarak dalam 5 jam?",
options:["240 km","260 km","300 km","320 km"],
answer:2
}

];

let current=0;
let score=0;
let timer;
let timeLeft=300; // 5 menit

function startQuiz(){
document.getElementById("startPage").classList.add("hidden");
document.getElementById("quizPage").classList.remove("hidden");
showQuestion();
}

function startTimer(){
timeLeft=300;
updateTimer();

timer=setInterval(()=>{
timeLeft--;
updateTimer();

if(timeLeft<=0){
clearInterval(timer);
nextQuestion(false);
}
},1000);
}

function updateTimer(){
let min=Math.floor(timeLeft/60);
let sec=timeLeft%60;
document.getElementById("timerText").innerText=
"Sisa Waktu: "+min+"m "+sec+"s";

document.getElementById("timerBar").style.width=
(timeLeft/300*100)+"%";
}

function showQuestion(){
const q=quiz[current];
document.getElementById("question").innerText=
(current+1)+". "+q.q;

const optDiv=document.getElementById("options");
optDiv.innerHTML="";

q.options.forEach((opt,i)=>{
const div=document.createElement("div");
div.className="option";
div.innerText=String.fromCharCode(65+i)+". "+opt;

div.onclick=()=>{
clearInterval(timer);
nextQuestion(i===q.answer);
};

optDiv.appendChild(div);
});

startTimer();
}

function nextQuestion(correct){
if(correct){score++; playSound(true);}
else{playSound(false);}

current++;
if(current<quiz.length){showQuestion();}
else{showResult();}
}

function showResult(){
document.getElementById("quizPage").classList.add("hidden");
document.getElementById("resultPage").classList.remove("hidden");

document.getElementById("result").innerHTML=
"Skor: <b>"+score+" / "+quiz.length+"</b>";
}
</script>

</body>
</html>
