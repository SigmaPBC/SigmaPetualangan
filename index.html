<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Challenges - Fixed</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .wheel-box {
            position: relative;
            width: 450px;
            height: 450px;
        }

        /* Panah Penunjuk */
        .arrow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff4757;
            z-index: 10;
        }

        #wheel-svg {
            width: 100%;
            height: 100%;
            transform: rotate(0deg);
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .segment-text {
            fill: white;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            text-transform: uppercase;
        }

        #spin-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #00d2d3;
            border: none;
            border-radius: 30px;
            color: #1a1a2e;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 210, 211, 0.3);
        }

        #spin-btn:hover { background: #01a3a4; }
        #spin-btn:active { transform: scale(0.95); }

        #result-text {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #feca57;
            text-align: center;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="wheel-box">
        <div class="arrow"></div>
        <svg id="wheel-svg" viewBox="0 0 400 400">
            <g id="wheel-group"></g>
        </svg>
    </div>

    <button id="spin-btn">PUTAR SEKARANG</button>
    <div id="result-text">Klik untuk main!</div>

    <script>
        const categories = [
            "Nama Pahlawan 🇮🇩",
            "Ilmu Pengetahuan Umum 🧠",
            "Tebak Judul Lagu 🎵",
            "Memory 🧩",
            "Tebak Arti Bhs Bugis 🗣️",
            "Tebak Jumlah Keluarga 👨‍👩‍👧",
            "Tebak Gambar / Emoji 🎨",
            "Sambung Kata 🔤"
        ];

        const colors = ["#ff6b6b", "#4834d4", "#686de0", "#6ab04c", "#f9ca24", "#f0932b", "#eb4d4b", "#130f40"];
        const wheelGroup = document.getElementById('wheel-group');
        const wheelSvg = document.getElementById('wheel-svg');
        const resultText = document.getElementById('result-text');
        const spinBtn = document.getElementById('spin-btn');

        // Buat segmen dan teks menggunakan SVG
        categories.forEach((name, i) => {
            const angle = 360 / categories.length;
            const startAngle = i * angle;
            const endAngle = (i + 1) * angle;
            
            // Logika menggambar busur (arc) SVG
            const x1 = 200 + 180 * Math.cos(Math.PI * startAngle / 180);
            const y1 = 200 + 180 * Math.sin(Math.PI * startAngle / 180);
            const x2 = 200 + 180 * Math.cos(Math.PI * endAngle / 180);
            const y2 = 200 + 180 * Math.sin(Math.PI * endAngle / 180);

            const pathData = `M 200 200 L ${x1} ${y1} A 180 180 0 0 1 ${x2} ${y2} Z`;
            
            // Buat Path Segmen
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathData);
            path.setAttribute("fill", colors[i]);
            path.setAttribute("stroke", "#ffffff");
            path.setAttribute("stroke-width", "2");
            wheelGroup.appendChild(path);

            // Buat Teks
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            const textAngle = startAngle + (angle / 2);
            const textX = 200 + 100 * Math.cos(Math.PI * textAngle / 180);
            const textY = 200 + 100 * Math.sin(Math.PI * textAngle / 180);
            
            text.setAttribute("x", textX);
            text.setAttribute("y", textY);
            text.setAttribute("fill", "white");
            text.setAttribute("font-size", "10px");
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("transform", `rotate(${textAngle}, ${textX}, ${textY})`);
            text.textContent = name;
            text.setAttribute("class", "segment-text");
            wheelGroup.appendChild(text);
        });

        let rotation = 0;

        spinBtn.onclick = () => {
            spinBtn.disabled = true;
            resultText.innerText = "Sedang berputar...";
            
            const extraDeg = Math.floor(Math.random() * 360) + 3600; // 10 putaran penuh + random
            rotation += extraDeg;
            
            wheelSvg.style.transform = `rotate(${rotation}deg)`;

            setTimeout(() => {
                spinBtn.disabled = false;
                
                // Kalkulasi hasil (disesuaikan dengan posisi awal SVG)
                const currentDeg = rotation % 360;
                // Offset 90 derajat karena panah ada di atas (posisi 12 siang)
                const winningIndex = Math.floor((360 - (currentDeg % 360) + 270) % 360 / 45);
                
                resultText.innerText = "🎯 " + categories[winningIndex];
            }, 5000);
        };
    </script>
</body>
</html>
