<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geometry Quest: Precision Angles</title>
<style>
    :root { --primary: #00d2ff; --secondary: #3a7bd5; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
    body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, var(--bg), #1e1b4b); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text); }
    .card { background: var(--card-bg); padding: 30px; border-radius: 24px; width: 440px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
    #quiz-screen { display: none; }
    h1 { font-size: 28px; margin: 0; background: linear-gradient(to right, #00d2ff, #9cedff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .story-box { font-style: italic; color: #94a3b8; font-size: 14px; margin-top: 10px; }
    svg { background: #ffffff; border-radius: 16px; margin: 20px 0; border: 1px solid #eee; }
    button { width: 100%; margin: 8px 0; padding: 14px; border: none; border-radius: 12px; background: #334155; cursor: pointer; font-weight: 600; font-size: 16px; transition: all 0.2s; color: white; }
    button:hover { background: #475569; transform: translateY(-2px); }
    .btn-start { background: linear-gradient(to right, var(--primary), var(--secondary)); margin-top: 25px; }
    .correct { background: #10b981 !important; }
    .wrong { background: #ef4444 !important; }
    #progress-bar { width: 100%; height: 6px; background: #334155; border-radius: 3px; margin-bottom: 20px; }
    #progress-fill { height: 100%; width: 0%; background: var(--primary); border-radius: 3px; transition: 0.4s; }
</style>
</head>
<body>

<div class="card">
    <div id="opening-screen">
        <h1>Geometry Quest</h1>
        <p>Fixed Math Precision • Type & Calculation</p>
        <div style="font-size: 50px; margin: 20px;">📐</div>
        <button class="btn-start" onclick="startGame()">Start Quiz</button>
    </div>

    <div id="quiz-screen">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="num-display" style="font-weight: bold; color: var(--primary);">STAGE 01</div>
        <p id="story-text" class="story-box"></p>
        <p id="question-text" style="font-size: 16px; margin: 10px 0; font-weight: 500;"></p>
        <svg id="svg-canvas" width="240" height="240"></svg>
        <div id="options-container"></div>
        <p style="margin-top:15px; font-size: 14px;">Score: <span id="score-val">0</span>/15</p>
    </div>
</div>

<script>
let idx = 0, score = 0;
// Pusat O ada di tengah kanvas
const pusat = {x: 120, y: 120}; 

// Fungsi trigonometri standar (0 deg = kanan, berlawanan arah jarum jam)
function getPoint(deg, r) {
    const rad = (deg * Math.PI) / 180;
    return {
        x: pusat.x + r * Math.cos(rad),
        y: pusat.y - r * Math.sin(rad) // SVG Y terbalik
    };
}

// Fungsi bantu membuat garis
function drawLine(deg, r=90, color="#1e293b", width=3) {
    const p = getPoint(deg, r);
    return `<line x1="${pusat.x}" y1="${pusat.y}" x2="${p.x}" y2="${p.y}" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`;
}

// Fungsi bantu busur arsiran biru (Pastikan sinkron dengan garis)
function drawArc(ang1, ang2, r=40, color="rgba(0, 210, 255, 0.2)") {
    const p1 = getPoint(ang1, r);
    const p2 = getPoint(ang2, r);
    const diff = (ang2 - ang1 + 360) % 360;
    const largeArc = diff > 180 ? 1 : 0;
    
    // String path SVG: Move ke pusat, Line ke p1, Arc ke p2, Close path Z
    return `<path d="M ${pusat.x} ${pusat.y} L ${p1.x} ${p1.y} A ${r} ${r} 0 ${largeArc} 1 ${p2.x} ${p2.y} Z" fill="${color}" stroke="none"/>`;
}

// Fungsi bantu menaruh label huruf
function drawLetter(deg, r, char) {
    const p = getPoint(deg, r);
    return `<text x="${p.x}" y="${p.y}" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">${char}</text>`;
}

const quizData = [
    // --- PART 1: IDENTIFICATION (Scenario-based) ---
    {
        story: "A laptop is slightly open.",
        q: "The screen makes a 35° angle. What type is this?",
        a: "Acute", opsi: ["Acute", "Obtuse", "Right"],
        render: () => {
            return drawArc(0, 35) + drawLine(0) + drawLine(35) + 
                   drawLetter(0, 100, "B") + drawLetter(35, 100, "A") + `<text x="110" y="125">O</text>`;
        }
    },
    {
        story: "A carpenter checks a table corner.",
        q: "It fits a perfect 90° square mark. This is a...",
        a: "Right Angle", opsi: ["Acute", "Right Angle", "Straight"],
        render: () => {
            return drawLine(0) + drawLine(90) + 
                   `<rect x="120" y="100" width="20" height="20" fill="none" stroke="red" stroke-width="2"/>` +
                   drawLetter(0, 100, "B") + drawLetter(90, 100, "A") + `<text x="110" y="125">O</text>`;
        }
    },
    {
        story: "A clock shows 4:00 PM.",
        q: "The hands form a 120° angle. Classify it:",
        a: "Obtuse", opsi: ["Obtuse", "Acute", "Reflex"],
        render: () => {
            // Clock hands use different logic, but this visual is correct for 120 deg obtuse
            return drawArc(0, 120) + drawLine(0) + drawLine(120) + 
                   `<circle cx="120" cy="120" r="4" fill="black"/>` + `<text x="115" y="135">O</text>`;
        }
    },
    {
        story: "A road represents a perfectly flat line.",
        q: "This forms a 180° angle. What type is this?",
        a: "Straight", opsi: ["Obtuse", "Straight", "Reflex"],
        render: () => {
            // FIXED: Added center point
            return drawLine(0) + drawLine(180) + 
                   `<circle cx="120" cy="120" r="6" fill="red"/>` + // Center point O
                   drawLetter(180, 100, "A") + drawLetter(0, 100, "B") + `<text x="110" y="135">O</text>`;
        }
    },
    {
        story: "A spinner rotates massively, almost a full circle.",
        q: "The outer rotation shown is 270°. What type is this?",
        a: "Reflex", opsi: ["Obtuse", "Reflex", "Straight"],
        render: () => {
            // FIXED: Position accurate (0 deg to 270 deg clockwise Y) and smaller size
            return drawArc(0, 270, 30) + drawLine(0, 80) + drawLine(270, 80) + 
                   `<circle cx="120" cy="120" r="4" fill="black"/>` + `<text x="115" y="135">O</text>`;
        }
    },

    // --- PART 2: CALCULATION (No Algebra) ---
    {
        story: "Level 1: Supplement",
        q: "AB is straight. If ∠BOC = 115°, find ∠AOC.",
        a: "65°", opsi: ["55°", "65°", "75°"],
        render: () => {
            pusat.y = 160; // Geser pusat ke bawah untuk visual sudut pelurus
            let g = drawLine(0)+drawLine(180)+drawLine(115)+drawLetter(0,100,"B")+drawLetter(115,100,"C")+drawLetter(180,100,"A")+
                   `<text x="110" y="175">O</text>`+`<text x="140" y="140" fill="red">115°</text>`;
            pusat.y = 120; // reset
            return g;
        }
    },
    {
        story: "Level 2: Complement",
        q: "∠AOB is 90°. If ∠BOC = 28°, find ∠AOC.",
        a: "62°", opsi: ["62°", "52°", "72°"],
        render: () => drawLine(0)+drawLine(90)+drawLine(28)+drawLetter(0,100,"B")+drawLetter(28,100,"C")+drawLetter(90,100,"A")
    },
    {
        story: "Level 3: Circle Part",
        q: "A full turn (360°) has parts 150° and 90°. What is the remaining angle?",
        a: "120°", opsi: ["110°", "120°", "130°"],
        render: () => drawLine(0)+drawLine(150)+drawLine(240)+
                       `<text x="150" y="100">150°</text>`+`<text x="90" y="150">90°</text>`
    },
    {
        story: "Level 4: Vertically Opposite",
        q: "Lines cross. Top is 74°. Find the bottom angle.",
        a: "74°", opsi: ["74°", "106°", "180°"],
        render: () => drawLine(30)+drawLine(210)+drawLine(150)+drawLine(330)+`<text x="110" y="90">74°</text>`
    },
    {
        story: "Level 5: Triangle Core",
        q: "Two angles are 45° and 85°. Find the third angle.",
        a: "50°", opsi: ["40°", "50°", "60°"],
        render: () => `<polygon points="120,60 50,180 190,180" fill="none" stroke="black" stroke-width="2"/>`
    },
    {
        story: "Level 6: Full Turn Slices",
        q: "4 angles make 360°. Three are 80° each. Find the 4th.",
        a: "120°", opsi: ["100°", "120°", "140°"],
        render: () => drawLine(0)+drawLine(80)+drawLine(160)+drawLine(240)
    },
    {
        story: "Level 7: Straight line split",
        q: "A 180° line is split into 4 equal parts. One part measures...",
        a: "45°", opsi: ["30°", "45°", "60°"],
        render: () => drawLine(0)+drawLine(45)+drawLine(90)+drawLine(135)+drawLine(180)
    },
    {
        story: "Level 8: Almost Circle",
        q: "A gap in a circle is 50°. What is the reflex angle?",
        a: "310°", opsi: ["300°", "310°", "320°"],
        render: () => drawArc(50, 360, 40, "rgba(200,0,0,0.1)")+drawLine(0)+drawLine(50)+`<text x="135" y="100">50° gap</text>`
    },
    {
        story: "Level 9: Joining Right",
        q: "Add 90° to 45°. The total rotation is?",
        a: "135°", opsi: ["125°", "135°", "145°"],
        render: () => drawLine(0)+drawLine(90)+drawLine(135)
    },
    {
        story: "Level 10: Symmetry",
        q: "Divide 360° into 5 equal parts. Each part is?",
        a: "72°", opsi: ["60°", "72°", "80°"],
        render: () => drawLine(0)+drawLine(72)+drawLine(144)+drawLine(216)+drawLine(288)
    }
];

function startGame() {
    document.getElementById("opening-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    showQuestion();
}

function showQuestion() {
    let s = quizData[idx];
    document.getElementById("num-display").innerText = "STAGE " + (idx < 9 ? "0" : "") + (idx + 1);
    document.getElementById("story-text").innerText = "Scenario: " + s.story;
    document.getElementById("question-text").innerText = s.q;
    document.getElementById("svg-canvas").innerHTML = s.render();
    document.getElementById("progress-fill").style.width = ((idx)/quizData.length)*100 + "%";

    let html = "";
    // Shuffle options for better gameplay
    let shuffled = [...s.opsi].sort(() => Math.random() - 0.5);
    shuffled.forEach(o => {
        html += `<button onclick="checkAnswer('${o}', this)">${o}</button>`;
    });
    document.getElementById("options-container").innerHTML = html;
}

function checkAnswer(choice, btn) {
    if (choice === quizData[idx].a) {
        score++;
        btn.classList.add("correct");
    } else {
        btn.classList.add("wrong");
    }
    document.getElementById("score-val").innerText = score;

    setTimeout(() => {
        idx++;
        if (idx < quizData.length) {
            showQuestion();
        } else {
            alert("Legend status achieved! Score: " + score + "/15");
            idx = 0; score = 0;
            document.getElementById("score-val").innerText = score;
            startGame(); // Reload quiz
        }
    }, 1000);
}
</script>
</body>
</html>
