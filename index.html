<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petualangan Matematika Cerdas</title>
  <style>
    :root {
      --primary: #6C5CE7;
      --secondary: #00CEC9;
      --accent: #FF7675;
      --success: #2ECC71;
      --error: #E74C3C;
      --bg: #F0F3F9;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-card {
      background: white;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(108, 92, 231, 0.15);
      max-width: 600px;
      width: 100%;
      padding: 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Halaman Awal */
    #welcome-screen {
      display: block;
    }

    #quiz-screen {
      display: none;
    }

    .icon-box {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    h1 {
      color: var(--primary);
      margin: 0;
      font-size: 2rem;
    }

    .description {
      color: #636e72;
      margin: 15px 0 30px;
      line-height: 1.6;
    }

    .btn-start {
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
      box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
    }

    .btn-start:hover {
      transform: scale(1.05);
      background: #5b4bc4;
    }

    /* Progress Bar */
    .progress-container {
      background: #dfe6e9;
      height: 12px;
      border-radius: 10px;
      margin: 20px 0;
      overflow: hidden;
    }

    #progress-bar {
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      height: 100%;
      width: 0%;
      transition: 0.4s;
    }

    .question {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 25px;
      min-height: 60px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .options button {
      padding: 18px;
      background: white;
      border: 2px solid #edeff2;
      border-radius: 15px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: 0.2s;
    }

    .options button:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f8f7ff;
    }

    .correct-ans {
      background: var(--success) !important;
      color: white;
      border-color: var(--success) !important;
    }

    .wrong-ans {
      background: var(--error) !important;
      color: white;
      border-color: var(--error) !important;
    }

    .feedback {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      font-weight: 500;
    }

    #next-btn {
      margin-top: 25px;
      width: 100%;
      padding: 15px;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    @media (max-width: 500px) {
      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="quiz-card">
    <div id="welcome-screen">
      <div class="icon-box">🎓</div>
      <h1>Halo, Jagoan Matematika!</h1>
      <p class="description">
        Apakah kamu siap mengasah otak? Kita akan belajar cara hitung cepat angka 10, satuan panjang, dan berat dengan
        cara yang seru!
      </p>
      <button class="btn-start" onclick="startQuiz()">Mulai Petualangan</button>
    </div>

    <div id="quiz-screen">
      <div style="display:flex; justify-content: space-between; font-weight: bold; color: var(--primary);">
        <span id="category-text">Matematika Dasar</span>
        <span id="stats">Soal 1/25</span>
      </div>
      <div class="progress-container">
        <div id="progress-bar"></div>
      </div>

      <div class="question" id="question">Memuat soal...</div>
      <div class="options" id="options"></div>

      <div class="feedback" id="feedback"></div>
      <button id="next-btn" onclick="nextQuestion()">Lanjut ➔</button>
    </div>
  </div>

  <script>
    const quizData = [
      // 15 Soal Dasar Angka 10
      { q: "45 × 10 = ...", o: ["4,5", "450", "4.500", "45"], a: 1, r: "Tambah satu nol di belakang." },
      { q: "700 ÷ 100 = ...", o: ["7.000", "70", "7", "0,7"], a: 2, r: "Hapus dua angka nol." },
      { q: "0,8 × 100 = ...", o: ["8", "80", "800", "0,08"], a: 1, r: "Geser koma ke kanan 2 kali." },
      { q: "1.250 ÷ 1.000 = ...", o: ["12,5", "125", "1,25", "0,125"], a: 2, r: "Geser koma ke kiri 3 kali." },
      { q: "3,45 × 1.000 = ...", o: ["345", "3.450", "34.500", "0,00345"], a: 1, r: "Koma geser ke kanan 3 langkah." },
      { q: "9 ÷ 10 = ...", o: ["0,9", "0,09", "90", "9,0"], a: 0, r: "Geser koma ke kiri 1 kali." },
      { q: "0,005 × 10.000 = ...", o: ["0,5", "5", "50", "500"], a: 2, r: "Geser koma ke kanan 4 kali." },
      { q: "56.000 ÷ 100 = ...", o: ["5.600", "560", "56", "5,6"], a: 1, r: "Hapus dua angka nol." },
      { q: "0,12 × 10 = ...", o: ["12", "1,2", "0,012", "120"], a: 1, r: "Geser koma ke kanan 1 kali." },
      { q: "4.300 ÷ 10 = ...", o: ["43", "4,3", "430", "43.000"], a: 2, r: "Hapus satu angka nol." },
      { q: "0,75 × 1.000 = ...", o: ["7.500", "75", "750", "7,5"], a: 2, r: "Geser koma ke kanan 3 kali." },
      { q: "2,5 ÷ 100 = ...", o: ["250", "0,25", "0,025", "0,0025"], a: 2, r: "Geser koma ke kiri 2 kali." },
      { q: "6,1 × 10.000 = ...", o: ["61.000", "6.100", "610.000", "0,00061"], a: 0, r: "Koma geser 4 kali ke kanan." },
      { q: "85 ÷ 1.000 = ...", o: ["0,85", "0,085", "0,0085", "8,5"], a: 1, r: "Geser koma ke kiri 3 kali." },
      { q: "100 × ... = 4.500", o: ["4,5", "45", "450", "0,45"], a: 1, r: "4.500 ÷ 100 = 45." },

      // 5 Soal Panjang
      { q: "5 km = ... m", o: ["50 m", "500 m", "5.000 m", "50.000 m"], a: 2, r: "Turun 3 tangga (kali 1.000)." },
      { q: "120 cm = ... m", o: ["1,2 m", "12 m", "0,12 m", "1200 m"], a: 0, r: "Naik 2 tangga (bagi 100)." },
      { q: "7,5 m = ... mm", o: ["75 mm", "750 mm", "7.500 mm", "75.000 mm"], a: 2, r: "Turun 3 tangga (kali 1.000)." },
      { q: "3.000 mm = ... cm", o: ["3 cm", "30 cm", "300 cm", "30.000 cm"], a: 2, r: "Naik 1 tangga (bagi 10)." },
      { q: "0,25 km = ... m", o: ["2,5 m", "25 m", "250 m", "2.500 m"], a: 2, r: "Turun 3 tangga (kali 1.000)." },

      // 5 Soal Berat
      { q: "5 kg = ... gram", o: ["50 g", "500 g", "5.000 g", "50.000 g"], a: 2, r: "Turun 3 tangga (kali 1.000)." },
      { q: "2.500 mg = ... gram", o: ["0,25 g", "2,5 g", "25 g", "250 g"], a: 1, r: "Naik 3 tangga (bagi 1.000)." },
      { q: "0,75 kg = ... gram", o: ["7,5 g", "75 g", "750 g", "7.500 g"], a: 2, r: "Turun 3 tangga (kali 1.000)." },
      { q: "Berat truk 2 ton = ... kg", o: ["20 kg", "200 kg", "2.000 kg", "20.000 kg"], a: 2, r: "1 ton = 1.000 kg." },
      { q: "450 gram = ... ons (hg)", o: ["4,5 ons", "45 ons", "0,45 ons", "4.500 ons"], a: 0, r: "Naik 2 tangga (bagi 100)." }
    ];

    let currentIdx = 0;
    let score = 0;

    function startQuiz() {
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      loadQuestion();
    }

    function loadQuestion() {
      const feedbackEl = document.getElementById('feedback');
      const nextBtn = document.getElementById('next-btn');
      const optionsEl = document.getElementById('options');
      const progressBar = document.getElementById('progress-bar');

      feedbackEl.style.display = 'none';
      nextBtn.style.display = 'none';
      optionsEl.innerHTML = '';

      let data = quizData[currentIdx];
      document.getElementById('question').innerText = data.q;
      document.getElementById('stats').innerText = `Soal ${currentIdx + 1} / ${quizData.length}`;
      progressBar.style.width = `${((currentIdx) / quizData.length) * 100}%`;

      data.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(i, btn);
        optionsEl.appendChild(btn);
      });
    }

    function checkAnswer(idx, btn) {
      const data = quizData[currentIdx];
      const buttons = document.querySelectorAll('.options button');
      const feedbackEl = document.getElementById('feedback');

      buttons.forEach(b => b.disabled = true);

      if (idx === data.a) {
        score++;
        btn.classList.add('correct-ans');
        feedbackEl.innerHTML = "✅ Benar! " + data.r;
        feedbackEl.style.color = "#155724";
        feedbackEl.style.background = "#d4edda";
      } else {
        btn.classList.add('wrong-ans');
        buttons[data.a].classList.add('correct-ans');
        feedbackEl.innerHTML = "❌ Salah! " + data.r;
        feedbackEl.style.color = "#721c24";
        feedbackEl.style.background = "#f8d7da";
      }
      feedbackEl.style.display = 'block';
      document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < quizData.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const quizScreen = document.getElementById('quiz-screen');
      const percent = Math.round((score / quizData.length) * 100);
      let message = percent >= 70 ? "Luar Biasa! 🌟" : "Terus Berlatih! 💪";

      quizScreen.innerHTML = `
            <div class="icon-box">${percent >= 70 ? '🏆' : '📚'}</div>
            <h1>Kuis Selesai!</h1>
            <p class="description">${message}<br>Kamu menjawab benar <b>${score}</b> dari <b>${quizData.length}</b> soal.</p>
            <div style="font-size: 3rem; font-weight: bold; color: var(--primary); margin-bottom: 20px;">${percent}%</div>
            <button class="btn-start" onclick="location.reload()">Main Lagi</button>
        `;
    }
  </script>
</body>

</html>
