Put your HTML text here<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Challenge Wheel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent: #00f2fe;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg-color);
            font-family: 'Montserrat', sans-serif;
            color: white;
        }

        .main-container {
            position: relative;
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 50px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Penunjuk Panah */
        .arrow {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff0055;
            z-index: 100;
            filter: drop-shadow(0 0 10px #ff0055);
        }

        .wheel-box {
            position: relative;
            width: 420px;
            height: 420px;
            margin-bottom: 30px;
        }

        #wheel-svg {
            width: 100%;
            height: 100%;
            transform: rotate(0deg);
            transition: transform 6s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .seg-text {
            fill: white;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            pointer-events: none;
            letter-spacing: 0.5px;
        }

        /* Tombol & Result */
        #spin-btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: 900;
            color: #0f172a;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
            letter-spacing: 2px;
        }

        #spin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.5);
        }

        #spin-btn:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
        }

        #result-display {
            margin-top: 20px;
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            min-height: 30px;
        }

        .center-dot {
            fill: #0f172a;
            stroke: var(--accent);
            stroke-width: 4;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="arrow"></div>
        <div class="wheel-box">
            <svg id="wheel-svg" viewBox="0 0 400 400">
                <g id="wheel-group"></g>
                <circle cx="200" cy="200" r="20" class="center-dot" />
            </svg>
        </div>

        <button id="spin-btn">PUTAR RODA</button>
        <div id="result-display">Siap Bermain?</div>
    </div>

    <script>
        const categories = [
            "Ilmu Pengetahuan Umum",
            "Tebak Judul Lagu",
            "Memori",
            "Tebak Arti Bugis",
            "Tebak Suara",
            "Tebak Gambar/Emoji",
            "Sambung Kata",
            "Bonus"
        ];

        const colors = [
            "#6366f1", "#a855f7", "#ec4899", "#ef4444",
            "#f59e0b", "#10b981", "#06b6d4", "#3b82f6"
        ];

        const wheelGroup = document.getElementById('wheel-group');
        const wheelSvg = document.getElementById('wheel-svg');
        const spinBtn = document.getElementById('spin-btn');
        const resultText = document.getElementById('result-display');

        // Render Segmen Roda
        categories.forEach((name, i) => {
            const angle = 360 / categories.length;
            const startAngle = i * angle;
            const endAngle = (i + 1) * angle;
            
            // Path Segmen
            const x1 = 200 + 190 * Math.cos(Math.PI * startAngle / 180);
            const y1 = 200 + 190 * Math.sin(Math.PI * startAngle / 180);
            const x2 = 200 + 190 * Math.cos(Math.PI * endAngle / 180);
            const y2 = 200 + 190 * Math.sin(Math.PI * endAngle / 180);

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M 200 200 L ${x1} ${y1} A 190 190 0 0 1 ${x2} ${y2} Z`);
            path.setAttribute("fill", colors[i]);
            path.setAttribute("stroke", "#0f172a");
            path.setAttribute("stroke-width", "2");
            wheelGroup.appendChild(path);

            // Teks Segmen
            const textAngle = startAngle + (angle / 2);
            const textX = 200 + 130 * Math.cos(Math.PI * textAngle / 180);
            const textY = 200 + 130 * Math.sin(Math.PI * textAngle / 180);
            
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", textX);
            text.setAttribute("y", textY);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("dominant-baseline", "middle");
            text.setAttribute("class", "seg-text");
            text.setAttribute("transform", `rotate(${textAngle}, ${textX}, ${textY})`);
            
            // Bungkus teks jika terlalu panjang
            const words = name.split(" ");
            if(words.length > 2) {
                text.innerHTML = `<tspan x="${textX}" dy="-5">${words[0]} ${words[1]}</tspan>
                                  <tspan x="${textX}" dy="12">${words.slice(2).join(" ")}</tspan>`;
            } else {
                text.textContent = name;
            }
            
            wheelGroup.appendChild(text);
        });

        let currentRotation = 0;

        spinBtn.onclick = () => {
            spinBtn.disabled = true;
            resultText.innerText = "🎡 Memutar...";
            
            const extraDeg = Math.floor(Math.random() * 360) + 3600; 
            currentRotation += extraDeg;
            
            wheelSvg.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                spinBtn.disabled = false;
                const actualDeg = currentRotation % 360;
                // Offset 270 derajat karena panah ada di posisi jam 12 (atas)
                const winIndex = Math.floor((360 - (actualDeg % 360) + 270) % 360 / 45);
                resultText.innerText = "🎯 " + categories[winIndex];
            }, 6000);
        };
    </script>
</body>
</html>
