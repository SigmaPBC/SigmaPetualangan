<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Average Challenge - Grade 5</title>
    <style>
        :root {
            --pink: #FFD1DC;
            --blue: #AEC6CF;
            --mint: #B3FBDE;
            --dark: #444;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--blue);
            color: var(--dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            background: var(--white);
            width: 95%;
            max-width: 750px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .screen { display: none; animation: slideUp 0.4s ease; }
        .active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* UI Elements */
        .btn {
            background: var(--pink);
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #e0b1bc;
            margin: 10px;
            transition: 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #e0b1bc; }
        .btn-blue { background: var(--blue); box-shadow: 0 4px #8ca4ad; }

        #progress-bar {
            width: 100%; height: 10px; background: #eee; border-radius: 10px; margin-bottom: 20px;
        }
        #progress-fill {
            width: 0%; height: 100%; background: var(--mint); border-radius: 10px; transition: 0.3s;
        }

        /* Visuals */
        .visual-container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
        }

        .bar {
            width: 40px;
            background: var(--pink);
            border-radius: 5px 5px 0 0;
            position: relative;
            display: flex;
            justify-content: center;
            color: #555;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .bar-label {
            position: absolute;
            bottom: -25px;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        /* Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .opt {
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .opt:hover { border-color: var(--blue); background: #f0f7f9; }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Screen 1: Welcome -->
    <div id="welcome" class="screen active">
        <div style="font-size: 50px;">📈</div>
        <h1>Solve the Average Questions</h1>
        <p>Advanced Level: Bar Charts, Line Graphs, and Missing Numbers!</p>
        <button class="btn" onclick="startQuiz()">Start Challenge</button>
    </div>

    <!-- Screen 2: Quiz -->
    <div id="quiz" class="screen">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold;">
            <span id="q-idx">Question 1/15</span>
            <span id="score-val">Score: 0</span>
        </div>

        <h3 id="q-text"></h3>
        <div id="visual" class="visual-container"></div>

        <div class="options-grid" id="opts"></div>

        <div id="feedback" class="feedback">
            <div id="status"></div>
            <div id="exp" style="font-size: 0.85rem; margin-top: 5px; color: #666;"></div>
            <button class="btn btn-blue" style="width:100%; margin: 15px 0 0 0;" onclick="nextQ()">Next Question ➔</button>
        </div>
    </div>

    <!-- Screen 3: Result -->
    <div id="result" class="screen">
        <h1>Challenge Complete!</h1>
        <div id="final-score" style="font-size: 3.5rem; margin: 15px 0;">0</div>
        <p id="final-msg"></p>
        <button class="btn" onclick="location.reload()">Restart</button>
    </div>
</div>

<script>
    const data = [
        { q: "A bar chart shows sales: Mon (15), Tue (25), Wed (20). Find the average.", type: "chart", val: [15, 25, 20], labs: ["Mon", "Tue", "Wed"], ans: [18, 20, 22, 25], correct: 1, exp: "(15+25+20) = 60. 60 ÷ 3 = 20." },
        { q: "Rainfall for 4 days: 4mm, 8mm, 0mm, 12mm. What is the average?", type: "chart", val: [4, 8, 0, 12], labs: ["D1", "D2", "D3", "D4"], ans: [4, 6, 8, 12], correct: 1, exp: "Total: 24. Divide by 4 days: 24 ÷ 4 = 6." },
        { q: "The average of 3 numbers is 10. If two numbers are 8 and 12, what is the third?", type: "missing", val: [8, 12, "?"], ans: [8, 10, 12, 14], correct: 1, exp: "Total must be 30 (10x3). 30 - 8 - 12 = 10." },
        { q: "Average scores of 5 students: 70, 80, 90, 80, 80. Find the average.", type: "chart", val: [70, 80, 90, 80, 80], labs: ["A", "B", "C", "D", "E"], ans: [75, 80, 85, 90], correct: 1, exp: "Total: 400. 400 ÷ 5 = 80." },
        { q: "Average of 4 numbers is 12. Three numbers are 10, 11, 15. Find the 4th.", type: "missing", val: [10, 11, 15, "?"], ans: [10, 11, 12, 13], correct: 2, exp: "Total needed: 48 (12x4). 48 - (10+11+15) = 12." },
        { q: "Look at the chart. What is the average temperature?", type: "chart", val: [22, 26, 30], labs: ["8am", "10am", "12pm"], ans: [24, 26, 28, 30], correct: 1, exp: "Total: 78. 78 ÷ 3 = 26." },
        { q: "A library borrows: Mon (30), Tue (50), Wed (40), Thu (0). Average per day?", type: "chart", val: [30, 50, 40, 0], labs: ["M", "T", "W", "Th"], ans: [30, 40, 25, 35], correct: 0, exp: "Total: 120. Divide by 4 days (including zero): 120 ÷ 4 = 30." },
        { q: "Average of 3 test scores is 85. Two scores are 80 and 85. What is the 3rd?", type: "missing", val: [80, 85, "?"], ans: [85, 90, 95, 80], correct: 1, exp: "Total needed: 255 (85x3). 255 - 165 = 90." },
        { q: "Five boxes weigh: 10kg, 12kg, 8kg, 15kg, 5kg. Average weight?", type: "chart", val: [10, 12, 8, 15, 5], labs: ["B1", "B2", "B3", "B4", "B5"], ans: [8, 9, 10, 11], correct: 2, exp: "Total: 50. 50 ÷ 5 = 10." },
        { q: "If average of 2 numbers is 50, and one is 40, what is the other?", type: "missing", val: [40, "?"], ans: [50, 60, 40, 70], correct: 1, exp: "Total: 100 (50x2). 100 - 40 = 60." },
        { q: "Plant growth (cm): Week 1 (5), Week 2 (9), Week 3 (10). Average?", type: "chart", val: [5, 9, 10], labs: ["W1", "W2", "W3"], ans: [6, 7, 8, 9], correct: 2, exp: "Total: 24. 24 ÷ 3 weeks = 8." },
        { q: "Money saved: $10, $15, $5, $10. Find the weekly average.", type: "chart", val: [10, 15, 5, 10], labs: ["W1", "W2", "W3", "W4"], ans: ["$8", "$10", "$12", "$15"], correct: 1, exp: "Total: 40. 40 ÷ 4 weeks = 10." },
        { q: "A car travels 40km, 60km, and 80km in 3 hours. Average speed?", type: "chart", val: [40, 60, 80], labs: ["H1", "H2", "H3"], ans: ["50km/h", "60km/h", "70km/h", "80km/h"], correct: 1, exp: "Total: 180. 180 ÷ 3 hours = 60." },
        { q: "Average of 4 friends' ages is 11. Three are 10, 12, 11. How old is the 4th?", type: "missing", val: [10, 12, 11, "?"], ans: [10, 11, 12, 13], correct: 1, exp: "Total: 44. 44 - 33 = 11." },
        { q: "Final: Average of 100, 200, 300, 400. Find it!", type: "chart", val: [10, 20, 30, 40], labs: ["100", "200", "300", "400"], ans: [200, 250, 300, 350], correct: 1, exp: "Total: 1000. 1000 ÷ 4 = 250." }
    ];

    let current = 0;
    let score = 0;
    let answered = false;

    function startQuiz() {
        current = 0; score = 0;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('quiz').classList.add('active');
        loadQ();
    }

    function loadQ() {
        answered = false;
        const q = data[current];
        document.getElementById('q-idx').innerText = `Question ${current + 1}/15`;
        document.getElementById('score-val').innerText = `Score: ${score}`;
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('progress-fill').style.width = (current/15)*100 + "%";

        const vis = document.getElementById('visual');
        vis.innerHTML = '';
        
        if(q.type === 'chart') {
            q.val.forEach((v, i) => {
                const b = document.createElement('div');
                b.className = 'bar';
                b.style.height = (v * 3) + 20 + "px"; // scaling
                b.innerHTML = `<span style="margin-top:5px">${v}</span><span class="bar-label">${q.labs[i]}</span>`;
                vis.appendChild(b);
            });
        } else {
            vis.innerHTML = `<h1 style="color:var(--blue)">${q.val.join(' , ')}</h1>`;
        }

        const oBox = document.getElementById('opts');
        oBox.innerHTML = '';
        q.ans.forEach((a, i) => {
            const d = document.createElement('div');
            d.className = 'opt';
            d.innerText = a;
            d.onclick = () => check(i);
            oBox.appendChild(d);
        });
    }

    function check(i) {
        if(answered) return;
        answered = true;
        const q = data[current];
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        
        if(i === q.correct) {
            score++;
            document.getElementById('status').innerHTML = "<b>✅ Excellent!</b>";
            fb.style.background = "#eaffea";
        } else {
            document.getElementById('status').innerHTML = "<b>❌ Not quite!</b>";
            fb.style.background = "#ffeaea";
        }
        document.getElementById('exp').innerText = "Explanation: " + q.exp;
    }

    function nextQ() {
        current++;
        if(current < 15) loadQ();
        else showResult();
    }

    function showResult() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('result').classList.add('active');
        document.getElementById('final-score').innerText = `${score} / 15`;
        document.getElementById('final-msg').innerText = score > 12 ? "You're a Math Genius! 🌟" : "Good job! Keep practicing! 💪";
    }
</script>
</body>
</html>
