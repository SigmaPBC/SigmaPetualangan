<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Math Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-primary: #7fb685;
            --mint-light: #e8f5e9;
            --pink-accent: #d8a7b1;
            --text-main: #2d3748;
            --bg-app: #f7fafc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Comfortaa', cursive;
            background-color: var(--bg-app);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .app-shell {
            width: 100%;
            max-width: 480px;
            background: white;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        @media (min-width: 480px) {
            .app-shell { height: 90vh; border-radius: 40px; }
        }

        /* Nav Header */
        .nav-header { padding: 25px 25px 10px; }
        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .progress-track {
            flex: 1; height: 12px; background: #edf2f7; border-radius: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: var(--mint-primary); width: 0%; transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Screen Management */
        .screen { display: none; flex: 1; flex-direction: column; padding: 20px 25px; overflow-y: auto; }
        .screen.active { display: flex; animation: slideIn 0.4s ease-out; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Logic Card (The Educational Soul) */
        .logic-card {
            background: var(--mint-light);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px solid white;
            box-shadow: 0 4px 15px rgba(127, 182, 133, 0.1);
        }
        .logic-badge {
            display: inline-block; background: var(--mint-primary); color: white;
            padding: 4px 12px; border-radius: 8px; font-size: 10px; font-weight: bold; margin-bottom: 10px;
        }
        .logic-text { font-size: 15px; font-weight: 700; color: #445e47; line-height: 1.4; }

        /* Question Area */
        .question-box {
            flex: 0 0 auto; margin-bottom: 30px; text-align: center;
        }
        .question-text { font-size: 32px; font-weight: 700; color: var(--text-main); }

        /* Answer Stack */
        .answer-stack { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .ans-btn {
            background: white; border: 2px solid #e2e8f0; padding: 20px; border-radius: 20px;
            font-family: 'Comfortaa'; font-size: 18px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; text-align: center; color: var(--text-main);
        }
        .ans-btn:hover { border-color: var(--mint-primary); background: #f0fff4; }
        .ans-btn:active { transform: scale(0.96); }

        /* General UI */
        .btn-large {
            background: var(--mint-primary); color: white; border: none; padding: 22px;
            border-radius: 25px; font-family: 'Comfortaa'; font-size: 20px; font-weight: bold;
            cursor: pointer; box-shadow: 0 10px 20px rgba(127, 182, 133, 0.3);
        }
        .score-display { font-size: 100px; font-weight: 700; color: var(--mint-primary); margin: 20px 0; }
        .feedback-text { color: #718096; font-size: 18px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="app-shell">
        <div id="scr-start" class="screen active" style="justify-content: center; text-align: center;">
            <div style="font-size: 70px; margin-bottom: 20px;">🎒</div>
            <h1 style="color: var(--mint-primary); margin: 0 0 10px;">Misi Sigma</h1>
            <p style="color: #a0aec0; margin-bottom: 40px;">Taklukkan angka dengan trik cerdas!</p>
            <button class="btn-large" onclick="startQuiz()">Mulai Belajar</button>
        </div>

        <div id="scr-quiz" class="screen">
            <div class="nav-header">
                <div class="progress-container">
                    <span id="step-info" style="font-size: 14px; font-weight: bold;">1/15</span>
                    <div class="progress-track"><div class="progress-fill" id="pb"></div></div>
                </div>
            </div>

            <div class="logic-card">
                <div class="logic-badge" id="l-badge">TRIK</div>
                <div class="logic-text" id="l-text">...</div>
            </div>

            <div class="question-box">
                <div class="question-text" id="q-text">...</div>
            </div>

            <div class="answer-stack" id="ans-container"></div>
        </div>

        <div id="scr-result" class="screen" style="justify-content: center; text-align: center;">
            <h2 style="margin: 0;">Misi Selesai!</h2>
            <div class="score-display" id="final-score">0</div>
            <p class="feedback-text" id="feedback-msg"></p>
            <button class="btn-large" style="background: var(--pink-accent); box-shadow: none; margin-top: 20px;" onclick="location.reload()">Coba Lagi</button>
        </div>
    </div>

<script>
    const quizData = [
        // STRUKTUR: DASAR -> TRIK NOL (TURUN) -> PEMBAGIAN (NAIK) -> REALITA
        { q: "4 x 6 = ...", t: "Logika Dasar", l: "Sama dengan menjumlahkan angka 6 sebanyak 4 kali.", a: ["20", "24", "28", "10"], c: "24" },
        { q: "7 x 3 = ...", t: "Logika Dasar", l: "Bayangkan ada 3 kelompok, masing-masing isi 7.", a: ["21", "18", "24", "25"], c: "21" },
        { q: "8 x 2 = ...", t: "Logika Dasar", l: "Angka 8 yang menjadi dua kali lipat!", a: ["14", "16", "18", "10"], c: "16" },

        { q: "5 x 10 = ...", t: "Trik Turun Tangga", l: "Turun 1 tangga = Tempelkan satu hadiah '0' di belakang angka.", a: ["5", "15", "50", "500"], c: "50" },
        { q: "3 x 100 = ...", t: "Trik Turun Tangga", l: "Turun 2 tangga = Tempelkan dua hadiah '00' di belakang.", a: ["30", "300", "33", "3000"], c: "300" },
        { q: "4 x 20 = ...", t: "Trik Simpan Nol", l: "Kalikan 4 x 2 dulu, lalu tempelkan nol yang disimpan.", a: ["60", "80", "100", "42"], c: "80" },

        { q: "30 x 30 = ...", t: "Double Power", l: "Kalikan 3 x 3, lalu tempelkan dua nol yang disimpan.", a: ["90", "900", "60", "9000"], c: "900" },
        { q: "60 x 5 = ...", t: "Simpan Nol", l: "6 x 5 adalah 30, lalu jangan lupa tempel nol-nya!", a: ["30", "110", "300", "350"], c: "300" },
        { q: "20 x 8 = ...", t: "Simpan Nol", l: "2 x 8 dulu, baru tempel nol di belakangnya.", a: ["16", "100", "160", "180"], c: "160" },

        { q: "90 : 10 = ...", t: "Trik Naik Tangga", l: "Naik 1 tangga = Hapus satu angka nol yang sama.", a: ["9", "90", "1", "19"], c: "9" },
        { q: "200 : 20 = ...", t: "Coret Adil", l: "Coret satu nol di kiri dan kanan, lalu hitung 20 : 2.", a: ["10", "2", "20", "100"], c: "10" },
        { q: "400 : 100 = ...", t: "Trik Naik Tangga", l: "Naik 2 tangga = Hapus dua angka nol yang sama.", a: ["4", "40", "400", "44"], c: "4" },

        { q: "Ada 4 ikat balon, tiap ikat isi 20. Berapa total balon?", t: "Soal Cerita", l: "Gunakan trik 4 x 2, lalu tempel nol-nya.", a: ["60", "80", "100", "24"], c: "80" },
        { q: "Ibu punya 50 permen untuk 5 anak. Satu anak dapat?", t: "Soal Cerita", l: "Gunakan trik 50 : 5 (Coret atau bagi angka depannya).", a: ["5", "10", "15", "50"], c: "10" },
        { q: "3 baris meja, tiap baris ada 10 meja. Totalnya?", t: "Soal Cerita", l: "Turun satu tangga dari angka 3!", a: ["13", "30", "300", "3"], c: "30" }
    ];

    let currentIdx = 0;
    let score = 0;

    function startQuiz() {
        document.getElementById('scr-start').classList.remove('active');
        document.getElementById('scr-quiz').classList.add('active');
        renderQuestion();
    }

    function renderQuestion() {
        const data = quizData[currentIdx];
        document.getElementById('step-info').innerText = (currentIdx + 1) + "/15";
        document.getElementById('pb').style.width = (currentIdx / quizData.length * 100) + "%";
        document.getElementById('l-badge').innerText = data.t;
        document.getElementById('l-text').innerText = data.l;
        document.getElementById('q-text').innerText = data.q;

        const container = document.getElementById('ans-container');
        container.innerHTML = "";
        data.a.sort(() => Math.random() - 0.5).forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.innerText = choice;
            btn.onclick = () => handleAnswer(choice);
            container.appendChild(btn);
        });
    }

    function handleAnswer(selected) {
        if(selected === quizData[currentIdx].c) score++;
        currentIdx++;
        if(currentIdx < quizData.length) renderQuestion();
        else showFinal();
    }

    function showFinal() {
        document.getElementById('scr-quiz').classList.remove('active');
        document.getElementById('scr-result').classList.add('active');
        const finalPercent = Math.round((score / quizData.length) * 100);
        document.getElementById('final-score').innerText = finalPercent;
        
        let msg = "Terus semangat belajar, ya!";
        if(finalPercent === 100) msg = "Luar Biasa! Kamu adalah Master Angka Sigma! 🌟";
        else if(finalPercent >= 80) msg = "Keren sekali! Logika berhitungmu sangat tajam. ✨";
        
        document.getElementById('feedback-msg').innerText = msg;
    }
</script>
</body>
</html>
