<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Bangun Datar - Media Belajar SD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2F2F2F;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #game-container {
            width: 95%;
            max-width: 800px;
            background: var(--white);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }

        .hidden { display: none !important; }

        /* Typography */
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 10px; }
        p { font-size: 1.1rem; line-height: 1.6; }

        /* Buttons */
        .btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin: 10px;
            box-shadow: 0 5px 0 #36b1a8;
        }

        .btn:hover { transform: translateY(-3px); background: #45b7af; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #36b1a8; }
        .btn-primary { background: var(--primary); box-shadow: 0 5px 0 #e65b5b; }

        /* Materi Cards */
        .materi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: var(--bg);
            border: 2px solid var(--secondary);
            border-radius: 20px;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover { transform: scale(1.05); background: var(--accent); }
        .card svg { width: 60px; height: 60px; margin-bottom: 10px; }

        /* Quiz Area */
        .quiz-img { margin: 20px auto; height: 150px; display: flex; justify-content: center; align-items: center; }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .opt-btn {
            background: white;
            border: 3px solid #ddd;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .opt-btn:hover { border-color: var(--secondary); background: #f0fdfc; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }

        /* Progress Bar */
        .progress-container { width: 100%; background: #eee; height: 10px; border-radius: 10px; margin-bottom: 20px; }
        #progress-bar { width: 0%; height: 100%; background: var(--secondary); border-radius: 10px; transition: 0.5s; }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce { animation: bounce 1s infinite; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="screen-menu">
        <div class="animate-bounce" style="font-size: 50px;">📐</div>
        <h1>Petualangan Bangun Datar</h1>
        <p>Halo Sahabat Pintar! Mari belajar mengenal bentuk-bentuk di sekitar kita dengan cara yang seru!</p>
        <div style="margin-top: 30px;">
            <button class="btn" onclick="showScreen('screen-materi')">📖 Mulai Belajar</button>
            <button class="btn btn-primary" onclick="startQuiz()">🎮 Mulai Kuis</button>
        </div>
    </div>

    <div id="screen-materi" class="hidden">
        <button class="btn" style="padding: 5px 20px; font-size: 1rem;" onclick="showScreen('screen-menu')">⬅ Kembali</button>
        <h2>Kenali Bangun Datar</h2>
        <p>Klik salah satu bentuk untuk melihat ciri-cirinya!</p>
        <div class="materi-grid" id="materi-list">
            </div>
        <div id="materi-detail" style="margin-top: 20px; padding: 20px; border-top: 2px dashed #ccc;" class="hidden">
            <h3 id="detail-title" style="color: var(--primary);"></h3>
            <p id="detail-desc"></p>
        </div>
    </div>

    <div id="screen-quiz" class="hidden">
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div id="question-number" style="font-weight: bold; color: var(--secondary);">Soal 1 dari 10</div>
        <div class="quiz-img" id="quiz-visual"></div>
        <h3 id="question-text">Memuat soal...</h3>
        <div class="options-grid" id="options-container">
            </div>
    </div>

    <div id="screen-result" class="hidden">
        <h1 id="result-title">Hebat!</h1>
        <div id="result-score" style="font-size: 4rem; font-weight: 800; color: var(--primary); margin: 20px 0;">0</div>
        <p id="result-message"></p>
        <button class="btn btn-primary" onclick="showScreen('screen-menu')">🏠 Menu Utama</button>
        <button class="btn" onclick="startQuiz()">🔄 Main Lagi</button>
    </div>
</div>

<script>
    // Konfigurasi Data Materi
    const dataBangun = {
        'Persegi': { desc: 'Punya 4 sisi yang sama panjang dan 4 sudut siku-siku.', color: '#FF6B6B', svg: '<rect x="10" y="10" width="80" height="80" fill="currentColor"/>' },
        'Persegi Panjang': { desc: 'Punya 2 pasang sisi sejajar yang sama panjang dan 4 sudut siku-siku.', color: '#4ECDC4', svg: '<rect x="5" y="25" width="90" height="50" fill="currentColor"/>' },
        'Segitiga': { desc: 'Bangun datar yang dibatasi oleh 3 buah sisi dan punya 3 buah titik sudut.', color: '#FFE66D', svg: '<polygon points="50,10 90,90 10,90" fill="currentColor"/>' },
        'Lingkaran': { desc: 'Hanya memiliki 1 sisi melengkung yang saling bertemu dan tidak punya sudut.', color: '#FF9F43', svg: '<circle cx="50" cy="50" r="40" fill="currentColor"/>' },
        'Jajar Genjang': { desc: 'Punya 2 pasang sisi sejajar, tapi sudutnya bukan siku-siku.', color: '#1dd1a1', svg: '<polygon points="30,20 95,20 70,80 5,80" fill="currentColor"/>' },
        'Layang-layang': { desc: 'Punya 2 pasang sisi sama panjang dan diagonalnya berpotongan tegak lurus.', color: '#5f27cd', svg: '<polygon points="50,5 90,40 50,95 10,40" fill="currentColor"/>' },
        'Belah Ketupat': { desc: 'Semua sisinya sama panjang dan kedua diagonalnya saling tegak lurus.', color: '#54a0ff', svg: '<polygon points="50,5 90,50 50,95 10,50" fill="currentColor"/>' },
        'Segi Lima': { desc: 'Memiliki 5 sisi dan 5 titik sudut. Sering disebut Pentagon.', color: '#ee5253', svg: '<polygon points="50,5 95,38 78,92 22,92 5,38" fill="currentColor"/>' }
    };

    // Data Kuis
    const questions = [
        { q: "Aku punya 4 sisi sama panjang dan 4 sudut siku-siku. Siapakah aku?", a: "Persegi", options: ["Persegi", "Persegi Panjang", "Segitiga", "Lingkaran"], type: "Persegi" },
        { q: "Berapakah jumlah titik sudut pada bangun Segitiga?", a: "3", options: ["3", "4", "5", "6"], type: "Segitiga" },
        { q: "Aku tidak punya sudut dan hanya punya satu sisi melengkung. Aku adalah...", a: "Lingkaran", options: ["Oval", "Segi Lima", "Lingkaran", "Belah Ketupat"], type: "Lingkaran" },
        { q: "Bangun datar yang punya 2 pasang sisi sejajar tapi tidak punya sudut siku-siku adalah...", a: "Jajar Genjang", options: ["Persegi", "Jajar Genjang", "Segitiga", "Persegi Panjang"], type: "Jajar Genjang" },
        { q: "Berapa banyak sisi yang dimiliki oleh bangun Segi Lima?", a: "5", options: ["4", "5", "6", "8"], type: "Segi Lima" },
        { q: "Aku mirip persegi tapi miring, keempat sisiku sama panjang. Aku adalah...", a: "Belah Ketupat", options: ["Jajar Genjang", "Layang-layang", "Belah Ketupat", "Lingkaran"], type: "Belah Ketupat" },
        { q: "Bangun yang bentuknya seperti mainan yang ditarik benang di udara adalah...", a: "Layang-layang", options: ["Segitiga", "Layang-layang", "Persegi", "Jajar Genjang"], type: "Layang-layang" },
        { q: "Pintu rumah biasanya berbentuk...", a: "Persegi Panjang", options: ["Persegi Panjang", "Lingkaran", "Segitiga", "Segi Lima"], type: "Persegi Panjang" },
        { q: "Atap rumah pada umumnya menyerupai bentuk...", a: "Segitiga", options: ["Lingkaran", "Segitiga", "Jajar Genjang", "Persegi"], type: "Segitiga" },
        { q: "Roda sepeda berbentuk...", a: "Lingkaran", options: ["Persegi", "Segi Lima", "Lingkaran", "Belah Ketupat"], type: "Lingkaran" }
    ];

    let currentQuestion = 0;
    let score = 0;

    // Navigasi Layar
    function showScreen(screenId) {
        document.querySelectorAll('#game-container > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    // Inisialisasi Materi
    const materiList = document.getElementById('materi-list');
    Object.keys(dataBangun).forEach(key => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<svg viewBox="0 0 100 100" style="color:${dataBangun[key].color}">${dataBangun[key].svg}</svg><div>${key}</div>`;
        div.onclick = () => {
            document.getElementById('materi-detail').classList.remove('hidden');
            document.getElementById('detail-title').innerText = key;
            document.getElementById('detail-desc').innerText = dataBangun[key].desc;
            speak(key + ". " + dataBangun[key].desc);
        };
        materiList.appendChild(div);
    });

    // Fitur Suara
    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'id-ID';
        window.speechSynthesis.speak(msg);
    }

    // Sistem Kuis
    function startQuiz() {
        currentQuestion = 0;
        score = 0;
        showScreen('screen-quiz');
        loadQuestion();
    }

    function loadQuestion() {
        const q = questions[currentQuestion];
        document.getElementById('question-number').innerText = `Soal ${currentQuestion + 1} dari ${questions.length}`;
        document.getElementById('progress-bar').style.width = `${((currentQuestion) / questions.length) * 100}%`;
        document.getElementById('question-text').innerText = q.q;
        
        // Load Visual
        const visualArea = document.getElementById('quiz-visual');
        visualArea.innerHTML = `<svg viewBox="0 0 100 100" style="height:100%; color:var(--secondary)">${dataBangun[q.type] ? dataBangun[q.type].svg : ''}</svg>`;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(choice, btn) {
        const correctAns = questions[currentQuestion].a;
        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.style.pointerEvents = 'none');

        if(choice === correctAns) {
            score += 10;
            btn.classList.add('correct');
            speak("Hebat! Jawabanmu benar.");
        } else {
            btn.classList.add('wrong');
            speak("Wah, kurang tepat. Semangat ya!");
            // Tunjukkan yang benar
            allBtns.forEach(b => { if(b.innerText === correctAns) b.classList.add('correct'); });
        }

        setTimeout(() => {
            currentQuestion++;
            if(currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }, 2000);
    }

    function showResult() {
        showScreen('screen-result');
        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('result-score').innerText = score;
        
        let msg = "";
        if(score >= 80) {
            msg = "Luar biasa! Kamu sudah jadi master bangun datar! 🌟";
            document.getElementById('result-title').innerText = "Sempurna!";
        } else if(score >= 50) {
            msg = "Bagus sekali! Sedikit lagi kamu akan jadi ahli! 💪";
            document.getElementById('result-title').innerText = "Keren!";
        } else {
            msg = "Ayo belajar lagi, jangan menyerah ya! Kamu pasti bisa! ❤️";
            document.getElementById('result-title').innerText = "Semangat!";
        }
        document.getElementById('result-message').innerText = msg;
        speak("Skormu adalah " + score + ". " + msg);
    }
</script>

</body>
</html>
